<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلاد ملكتي مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #1e0031;
            --main-pink: #ff4d6d;
            --white: #ffffff;
        }
        body { 
            background: #000 url('https://shado712.github.io/marea/bg.png') no-repeat center center fixed;
            background-size: cover; margin: 0; font-family: 'Cairo', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; color: var(--white);
        }

        /* حاوية الصفحات بنظام الانزلاق */
        .slider-container {
            width: 85%; max-width: 420px; height: 550px;
            position: relative; overflow: hidden;
            border-radius: 40px;
            /* التأثير الزجاجي (Glassmorphism) */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .slide {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(100%); /* البداية خارج الشاشة يميناً */
        }

        .slide.active { transform: translateX(0); } /* الصفحة الحالية */
        .slide.prev { transform: translateX(-100%); } /* الصفحة السابقة تخرج لليسار */

        /* المربع المضمن للصور المتحركة - تصميم أنثوي */
        .img-card {
            width: 250px; height: 250px;
            background-color: var(--white);
            border-radius: 30px; /* حواف أنثوية وناعمة جداً */
            margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.3);
            animation: fadeIn 1s ease;
        }
        /* حجم الملصق التعبيري الكبير جداً */
        .img-card .emoji { font-size: 150px; }

        /* تنسيق النصوص حرة - بدون حدود Border */
        .content {
            text-align: center; width: 95%;
            margin-bottom: 30px;
            animation: fadeIn 1.2s ease;
        }
        .content h1 { font-size: 24px; color: #ff8fa3; margin-bottom: 10px; }
        .content p { font-size: 17px; line-height: 1.7; color: var(--white); margin: 0; font-weight: 600; }

        /* الأزرار التفاعلية - تصميم أنثوي ناعم */
        .btn-nav {
            background: var(--main-pink); color: var(--white); border: none;
            padding: 15px 45px; border-radius: 50px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 77, 109, 0.4);
            transition: 0.3s;
        }
        .btn-nav:active { transform: scale(0.95); }

        /* مطر القلوب بالخلفية */
        .hearts-bg { position: fixed; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .heart-fall { position: absolute; animation: fall linear infinite; color: #ffb3c1; font-size: 20px; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="hearts-bg" id="hearts"></div>

    <div class="slider-container" id="main-container">
        </div>

    <script>
        // مصفوفة البيانات بملصقات كبيرة (Emojis) لكل صفحة
        const story = [
            { t: "اليوم ميلاد أغلى إنسانة 🎈", p: "مارية.. اليوم مو بس يوم ميلادج، اليوم ميلاد الفرح لقلبي. كل عام وأنتي قطعة من روحي.", e: "🎂", b: "مستعدة؟ ✨" },
            { t: "فخر حيدر وسنده", p: "أنتي مو بس حبيبتي، أنتي الوردة اللي بستاني. ربي يحفظج لي يا ملكة قلبي.", e: "👸", b: "كملي القراءة ✨" },
            { t: "عساج دوم سعيدة 😍", p: "تخيلي ضحكتج يوم ميلادج دموع الفرح بعين أبوج وأمج. كل تعب يسهريه حيدر يسوى.", e: "🎉", b: "ماكو مستحيل ✨" },
            { t: "احلمي براحتج يا ذكية 📖", p: "أنتي كدها ومو ناقصج شي. ادرسي واجتهدي وخلي الباقي على رب العالمين.", e: "👩‍🎓", b: "بقت أيام قليلة ✨" },
            { t: "دكتورة المستقبل ✨", p: "اضغطي على قلبج وشوفي شكد يشتاق للنجاح.. ادرسي لرقية المستقبيلة.", e: "❤️", b: "دوسي عالقلب 👇" },
            { t: "وعد للنجاح؟ 💍", p: "أريد منج وعد يا مارية، انو متبجين من مادة صعبة، بل تحاولين لحد ما تسيطرين عليها.", e: "🏆", b: "أحبج مارية ❤️" },
            { t: "مستقبلج ينتظرج ❤️", p: "انتهى وقت الكلام.. حلمج يصيحج هسة، روحي ادرسي وعيني باردة عليج! أحلى عطلة ننتظرها.", e: "💝", b: "يلا ادرسي ✅" }
        ];

        let currentIdx = 0;
        const container = document.getElementById('main-container');

        // دالة لعرض الصفحة بنظام الانزلاق
        function renderPage() {
            container.innerHTML = ''; // تفريغ الحاوية
            const data = story[currentIdx];
            
            // إنشاء البطاقة البيضاء المضمنة للصورة/الملصق
            let mediaContent;
            if (data.t.includes('قلب')) {
                // إذا كان قلب تفاعلي
                mediaContent = `<div class="emoji-heart" style="font-size: 100px; color: #ff4d6d; animation: pulse 1s infinite; cursor: pointer; display: none;" onclick="nextPage()">❤️</div>`;
            } else {
                // إذا كان ملصق عادي
                mediaContent = `<div class="img-card"><span class="emoji">${data.e}</span></div>`;
            }

            const slide = document.createElement('div');
            slide.className = `slide active`;
            slide.innerHTML = `
                ${mediaContent}
                <div class="content">
                    <h1>${data.t}</h1>
                    <p>${data.p}</p>
                </div>
                ${!data.t.includes('قلب') ? `<button class="btn-nav" onclick="nextPage()">${data.b}</button>` : ''}
            `;
            container.appendChild(slide);
        }

        // دالة الانتقال للصفحة التالية
        function nextPage() {
            if (currentIdx < story.length - 1) {
                currentIdx++;
                renderPage();
            } else {
                alert("ربي يحفظج يا مارية وينجحج! ❤️");
                container.innerHTML = `<div class="content"><h1>تم إرسال دعاء النجاح لقلبج ❤️</h1><p>يلا كافي نت، روحي ادرسي!</p></div>`;
            }
        }

        // مطر القلوب
        setInterval(() => {
            const h = document.createElement('div');
            h.className = 'heart-fall'; h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.top = '-50px';
            h.style.fontSize = (Math.random() * 20 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 400);

        // عرض أول صفحة
        renderPage();
    </script>
</body>
</html>

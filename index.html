<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلاد ملكتي مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: background 1s ease-in-out;
            background: #000; color: white;
        }

        .main-container {
            width: 100%; max-width: 480px; height: 100vh;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .slide {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.8s ease;
            transform: scale(0.9); opacity: 0; padding: 20px; box-sizing: border-box;
        }

        .slide.active { transform: scale(1); opacity: 1; z-index: 2; }
        .slide.prev { transform: translateY(-100%); opacity: 0; }

        /* البطاقة الزجاجية الفخمة */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 40px; padding: 25px; width: 95%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        /* المربع الأبيض للصور المتحركة */
        .img-frame {
            width: 260px; height: 260px;
            margin: 0 auto 25px; border-radius: 35px;
            background: white; border: 5px solid #ffdeeb;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.3);
        }
        .img-frame img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 26px; color: #ff8fa3; margin: 10px 0; }
        p { font-size: 18px; line-height: 1.7; margin-bottom: 30px; font-family: 'Amiri', serif; }

        .btn-action {
            background: linear-gradient(90deg, #ff4d6d, #ff8fa3);
            color: white; border: none; padding: 16px 50px;
            border-radius: 50px; font-size: 19px; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        .floating-sticker { position: absolute; pointer-events: none; z-index: 1; animation: floatUp linear infinite; }
    </style>
</head>
<body>

    <div class="main-container" id="slider"></div>

    <script>
        const storyData = [
            { 
                t: "ميلاد ملكة قلبي مارية 👑", 
                p: "اليوم نورت الدنيا كلها بوجودج. كل عام وأنتي أجمل شي صار بحياتي يا روحي.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", 
                b: "مستعدة للحفلة؟ ✨", 
                bg: "radial-gradient(circle, #200122, #000000)",
                icons: ['🎈', '✨']
            },
            { 
                t: "كيكة ميلادج يا كيكة 😍", 
                p: "ربي يجعلها سنة فرح وسعادة وتحققين بيها كل أحلامج يا مارية الطيبة.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", 
                b: "أحبج هواي ❤️", 
                bg: "linear-gradient(135deg, #4b1248, #000000)",
                icons: ['🎂', '💖']
            },
            { 
                t: "اعتذار من القلب 😔", 
                p: "مارية.. والله قلبي يوجعني لأن بعيد عنج هسة وما كدرت أكون أول واحد يقدملج هدية بإيده.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9uH9T34u3U7YUnD/giphy.gif", 
                b: "سامحيني يا روحي 🥺", 
                bg: "linear-gradient(135deg, #0f0c29, #302b63)",
                icons: ['🌧️', '💔']
            },
            { 
                t: "أنتي أغلى هدية 🎁", 
                p: "أوعدج أول ما نلتقي أسويلج حفلة ما صايرة وأعوضج عن كل ثانية كنت بيها بعيد عنج.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L4lvBpHWkARu7Aac75/giphy.gif", 
                b: "وعد حيدر 💍", 
                bg: "linear-gradient(135deg, #5c2b4c, #2d1b33)",
                icons: ['🎁', '💍']
            },
            { 
                t: "ضحكتج هي عيدي 🎆", 
                p: "يلا هسة اضحكي ونوري الدنيا، حيدر يحبج ويموت عليج. ميلاد سعيد يا نبض قلبي!", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v86vXfG1KzE3MvW5sE/giphy.gif", 
                b: "أعشقج للأبد ❤️", 
                bg: "linear-gradient(135deg, #ff8fa3, #ffe5ec)",
                icons: ['🎆', '🌸']
            }
        ];

        let current = 0;
        const slider = document.getElementById('slider');

        storyData.forEach((item, i) => {
            const slide = document.createElement('div');
            slide.className = `slide ${i === 0 ? 'active' : ''}`;
            slide.innerHTML = `
                <div class="glass-card">
                    <div class="img-frame"><img src="${item.g}" alt="Birthday"></div>
                    <h1>${item.t}</h1>
                    <p>${item.p}</p>
                    <button class="btn-action" onclick="nextSlide()">${item.b}</button>
                </div>
            `;
            slider.appendChild(slide);
        });

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (current < slides.length - 1) {
                slides[current].classList.remove('active');
                slides[current].classList.add('prev');
                current++;
                slides[current].classList.add('active');
                document.body.style.background = storyData[current].bg;
            } else {
                alert("كل عام وأنتي بخير مارية! ❤️");
            }
        }

        setInterval(() => {
            const icons = storyData[current].icons;
            const s = document.createElement('div');
            s.className = 'floating-sticker';
            s.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            s.style.left = Math.random() * 90 + 'vw';
            s.style.animationDuration = Math.random() * 3 + 4 + 's';
            s.style.fontSize = '30px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 6000);
        }, 300);

        document.body.style.background = storyData[0].bg;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلاد مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; overflow: hidden; 
            font-family: 'Cairo', sans-serif; transition: background 1s ease;
            background-color: #fff;
        }

        .container {
            height: 100vh; width: 100%; display: flex;
            align-items: center; justify-content: center; position: relative;
            z-index: 10;
        }

        .page {
            position: absolute; width: 90%; max-width: 500px;
            text-align: center; opacity: 0; visibility: hidden;
            transform: scale(0.8); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .page.active { opacity: 1; visibility: visible; transform: scale(1); }

        /* الرسوم التوضيحية الملكية بدلاً من GIF */
        .illustration-card {
            width: 280px; height: 280px; margin: 0 auto 20px;
            border-radius: 30px; 
            display: flex; align-items: center; justify-content: center;
            background: #fff; border: 4px solid #ffdeeb;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            font-size: 140px; color: #ff8fa3;
        }

        h1 { font-size: 38px; color: #d63384; margin-bottom: 8px; }
        p { font-family: 'Amiri', serif; font-size: 24px; color: #555; line-height: 1.6; margin-bottom: 30px; font-weight: bold; }

        /* أزرار تفاعلية بأشكال شموع وكيك */
        .special-btn {
            font-size: 55px; cursor: pointer; transition: 0.3s;
            background: none; border: none; outline: none;
            display: inline-block; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }
        .special-btn:hover { transform: scale(1.2) rotate(-5deg); }
        .label { display: block; font-size: 16px; color: #d63384; margin-top: 5px; font-weight: 900; }

        /* استيكرات الخلفية المتساقطة */
        .falling-sticker {
            position: absolute; top: -60px;
            pointer-events: none; z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body id="masterBody">

    <div class="container" id="slider"></div>

    <script>
        const story = [
            { t: "ميلاد ملكتي مارية 👑", p: "اليوم نورت الدنيا بضحكتج الساحرة. كل عام وأنتي قطعة من روحي.", i: "👸", bg: "#fff0f3", btn: "🎂", lab: "افتحي الكيكة", rain: "🎈" },
            { t: "أجمل من كبر سنة 😍", p: "صرتي أحلى بمليون مرة، وربي لا يحرمني منج ومن طيبتج.", i: "🎂", bg: "#f0f7ff", btn: "🕯️", lab: "ضوي الشمعة", rain: "🍰" },
            { t: "اعتذار مرّ القسوة 😔", p: "مارية.. قلبي يوجعني لأن بعيد وما كدرت أجيب لج هدية تليق بيج.", i: "💔", bg: "#f8f9fa", btn: "🥺", lab: "سامحيني", rain: "🌧️" },
            { t: "أنتي أغلى هدية 🎁", p: "لو بيدي أجيب لج نجوم السما وأخليها بين إيدج ما أقصر يا روحي.", i: "🎁", bg: "#fff9e6", btn: "🎁", lab: "افتحي الهدية", rain: "💎" },
            { t: "وعد حيدر للأبد 💍", p: "أوعدج أول ما نلتقي أعوضج عن كل ثانية كنت بيها بعيد. أنتي ملكتي.", i: "💍", bg: "#f3e5f5", btn: "🔐", lab: "قفلت قلبي", rain: "💖" },
            { t: "يا قطعة من الجنة 🌸", p: "ضحكتج هي اللي تصبرني على هالأيام الصعبة. لا تحرميني منها أبد.", i: "🌹", bg: "#e8f5e9", btn: "🌻", lab: "يا وردة", rain: "🌻" },
            { t: "طفلتي المدللة 🧸", p: "تبقين بنظري ذيج الطفلة اللي أخاف عليها من الهوا. تدللي ماريتي.", i: "🧸", bg: "#fff3e0", btn: "🍭", lab: "تدللي ✅", rain: "🍬" },
            { t: "المسافة مجرد أرقام 🌏", p: "قلوبنا متصلة بحبل ما ينقطع أبد. أنتي بكل دقة من قلبي.", i: "🌏", bg: "#e0f2f1", btn: "🗝️", lab: "المفتاح وياج", rain: "✨" },
            { t: "عمر جديد وحب جديد ❤️", p: "يا رب تكون هالسنة بداية لكل خير تتمنيه. حيدر وياج لآخر نفس.", i: "💞", bg: "#fff0f6", btn: "🥰", lab: "أعشقج", rain: "💞" },
            { t: "تم الصلح والاحتفال! ✅", p: "يلا هسة اضحكي ونوري دنيتي بضحكتج. ميلاد سعيد يا أحلى مارية بالعالم!", i: "🎇", bg: "#ffffff", btn: "🍾", lab: "احتفلي!", rain: "🎇" }
        ];

        let cur = 0;
        const slider = document.getElementById('slider');
        const bgBody = document.getElementById('masterBody');

        function build() {
            story.forEach((page, i) => {
                const div = document.createElement('div');
                div.className = `page ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="illustration-card">${page.i}</div>
                    <h1>${page.t}</h1>
                    <p>${page.p}</p>
                    <button class="special-btn" onclick="nextPage()">
                        ${page.btn}
                        <span class="label">${page.lab}</span>
                    </button>
                `;
                slider.appendChild(div);
            });
            bgBody.style.backgroundColor = story[0].bg;
        }

        function nextPage() {
            const pages = document.querySelectorAll('.page');
            if (cur < pages.length - 1) {
                pages[cur].classList.remove('active');
                cur++;
                pages[cur].classList.add('active');
                bgBody.style.backgroundColor = story[cur].bg;
            } else {
                alert("أحبج مارية.. ميلاد سعيد ❤️");
            }
        }

        setInterval(() => {
            const r = document.createElement('div');
            r.className = 'falling-sticker';
            r.innerHTML = story[cur].rain;
            r.style.left = Math.random() * 100 + 'vw';
            r.style.fontSize = Math.random() * 20 + 30 + 'px';
            r.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 5000);
        }, 400);

        build();
    </script>
</body>
</html>

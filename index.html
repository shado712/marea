<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلاد مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; overflow: hidden; 
            font-family: 'Cairo', sans-serif; transition: background 1.2s ease;
            background-color: #fff5f7;
        }

        .container {
            height: 100vh; width: 100%; display: flex;
            align-items: center; justify-content: center; position: relative;
            z-index: 10;
        }

        .page {
            position: absolute; width: 90%; max-width: 500px;
            text-align: center; opacity: 0; visibility: hidden;
            transform: scale(0.85) translateY(30px); 
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        .page.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }

        /* الصورة المتحركة - GIFs جديدة ومضمونة */
        .gif-frame {
            width: 250px; height: 250px; margin: 0 auto 20px;
            border-radius: 30px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .gif-frame img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 35px; color: #d63384; margin-bottom: 8px; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
        p { font-family: 'Amiri', serif; font-size: 22px; color: #444; line-height: 1.6; margin-bottom: 25px; font-weight: bold; }

        /* أزرار تفاعلية (كيك وشموع) */
        .gift-btn {
            font-size: 55px; cursor: pointer; transition: 0.4s;
            background: none; border: none; outline: none;
            display: inline-block; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }
        .gift-btn:hover { transform: scale(1.2) rotate(-5deg); }
        .label { display: block; font-size: 15px; color: #d63384; margin-top: 5px; font-weight: 900; }

        /* الاستيكرات المتساقطة من الأعلى */
        .rain {
            position: absolute; top: -60px;
            pointer-events: none; z-index: 1;
            animation: falling linear forwards;
        }
        @keyframes falling { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body id="dynamicBg">

    <div class="container" id="master"></div>

    <script>
        const story = [
            { t: "ميلاد ملكتي مارية 👑", p: "اليوم نورت الدنيا بضحكتج. كل عام وأنتي أجمل شي صار بحياتي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", bg: "#fff0f3", btn: "🎂", lab: "افتحي الكيكة", rain: "🎈" },
            { t: "أحلى من كبر سنة 😍", p: "صرتي أحلى بمليون مرة، وربي لا يحرمني منج ومن طيبتج.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v86vXfG1KzE3MvW5sE/giphy.gif", bg: "#f0f7ff", btn: "🕯️", lab: "ضوي الشمعة", rain: "🍰" },
            { t: "اعتذار مرّ القسوة 😔", p: "مارية.. قلبي يوجعني لأن بعيد وما كدرت أجيب لج هدية تليق بيج.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9uH9T34u3U7YUnD/giphy.gif", bg: "#f8f9fa", btn: "🥺", lab: "سامحيني", rain: "🌧️" },
            { t: "أنتي أغلى هدية 🎁", p: "لو بيدي أجيب لج نجوم السما وأخليها بين إيدج ما أقصر يا روحي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L4lvBpHWkARu7Aac75/giphy.gif", bg: "#fff9e6", btn: "🎁", lab: "افتحي الهدية", rain: "💎" },
            { t: "وعد حيدر للأبد 💍", p: "أوعدج أول ما نلتقي أعوضج عن كل ثانية كنت بيها بعيد. أنتي ملكتي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9uH9T34u3U7YUnD/giphy.gif", bg: "#f3e5f5", btn: "💍", lab: "وعد الأبد", rain: "💖" },
            { t: "يا قطعة من الجنة 🌸", p: "ضحكتج هي اللي تصبرني على هالأيام الصعبة. لا تحرميني منها.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VduFvSgSPS2H4XpnhB/giphy.gif", bg: "#e8f5e9", btn: "🌹", lab: "يا وردة", rain: "🌻" },
            { t: "طفلتي المدللة 🧸", p: "تبقين بعيني ذيج الطفلة اللي أخاف عليها من الهوا. تدللي ماريتي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", bg: "#fff3e0", btn: "🧸", lab: "دلولة حيدر", rain: "🍭" },
            { t: "المسافة مجرد أرقام 🌏", p: "قلوبنا متصلة بحبل ما ينقطع أبد. أنتي بكل دقة من قلبي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/3o7TKuylOmX8ReLth6/giphy.gif", bg: "#e0f2f1", btn: "🔐", lab: "قفلت قلبي", rain: "✨" },
            { t: "سندي الأبدي 💪", p: "راح أبقى خلفج، جبلاً ما يميل، لحد ما أحلامج تصير حقيقة نلمسها.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", bg: "#f1f8e9", btn: "🛡️", lab: "سندج", rain: "💞" },
            { t: "ابتسامتج هي العيد 🎉", p: "ما أريد أشوف دمعة بعينج، أريد بس الضحكة اللي تضوي دنيتي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", bg: "#fff0f6", btn: "🤩", lab: "اضحكيلي", rain: "🎇" },
            { t: "يا عطر الورد 🌹", p: "كل عام وأنتي بستان ورد بوسط صحراء أيامي الصعبة.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VduFvSgSPS2H4XpnhB/giphy.gif", bg: "#fffde7", btn: "🌻", lab: "يا عطري", rain: "🌸" },
            { t: "أنتي استثنائية ✨", p: "ما تشبهين أحد، أنتي النسخة الوحيدة اللي سكنت روحي وبالي.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", bg: "#e1f5fe", btn: "💎", lab: "يا فريدة", rain: "✨" },
            { t: "حلمي القادم 🌙", p: "تمنيت أكون يمج هسة، بس الوعد إن اللقاء صار قريب جداً.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", bg: "#ede7f6", btn: "💍", lab: "قريباً", rain: "🌠" },
            { t: "عمر جديد وحب جديد ❤️", p: "يا رب تكون هالسنة بداية لكل خير تتمنيه. حيدر وياج لآخر نفس.", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", bg: "#fce4ec", btn: "🥰", lab: "أعشقج", rain: "💞" },
            { t: "تم الصلح يا روحي! ✅", p: "يلا اضحكي هسة ونوري دنيتي. ميلاد سعيد يا أحلى مارية بالعالم!", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", bg: "#ffffff", btn: "🥂", lab: "احتفلي!", rain: "🎇" }
        ];

        let cur = 0;
        const master = document.getElementById('master');

        function build() {
            story.forEach((page, i) => {
                const div = document.createElement('div');
                div.className = `page ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="gif-frame"><img src="${page.gif}"></div>
                    <h1>${page.t}</h1>
                    <p>${page.p}</p>
                    <button class="gift-btn" onclick="nextPage()">
                        ${page.btn}
                        <span class="label">${page.lab}</span>
                    </button>
                `;
                master.appendChild(div);
            });
            document.body.style.backgroundColor = story[0].bg;
        }

        function nextPage() {
            const pages = document.querySelectorAll('.page');
            if (cur < pages.length - 1) {
                pages[cur].classList.remove('active');
                cur++;
                pages[cur].classList.add('active');
                document.body.style.backgroundColor = story[cur].bg;
            } else {
                alert("أحبج مارية.. ميلاد سعيد ❤️");
            }
        }

        setInterval(() => {
            const r = document.createElement('div');
            r.className = 'rain';
            r.innerHTML = story[cur].rain;
            r.style.left = Math.random() * 100 + 'vw';
            r.style.fontSize = Math.random() * 20 + 30 + 'px';
            r.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 5000);
        }, 400);

        build();
    </script>
</body>
</html>

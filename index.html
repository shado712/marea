<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلاد مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=El+Messiri:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100%;
            overflow: hidden; font-family: 'Cairo', sans-serif;
            background: #000;
        }

        /* خلفية سائلة تتحرك ألوانها تلقائياً */
        .bg-gradient {
            position: fixed; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(125deg, #2d1b33, #000, #4b1248, #0f0c29);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .page {
            position: absolute; width: 85%; text-align: center;
            opacity: 0; transform: scale(1.1);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .page.active { opacity: 1; transform: scale(1); pointer-events: auto; }

        /* الصورة في المنتصف - شفافة وبدون حدود */
        .main-sticker {
            width: 320px; height: 320px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255, 77, 109, 0.4));
        }

        /* كتابة حرة ضخمة */
        h1 {
            font-family: 'El Messiri', sans-serif; font-size: 50px;
            color: #ff8fa3; margin: 0; line-height: 1.2;
        }
        p {
            font-size: 24px; color: #fff; margin: 20px 0 40px;
            font-weight: 200; opacity: 0.9;
        }

        /* زر بسيط ومختفي تقريباً حتى تلمسه */
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 18px 70px; border-radius: 20px;
            font-size: 20px; cursor: pointer; transition: 0.3s;
        }
        .nav-btn:hover { background: #ff4d6d; border-color: #ff4d6d; }

        /* استيكرات الخلفية */
        .bg-elements {
            position: absolute; pointer-events: none;
            font-size: 25px; animation: floatUp 6s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient" id="bgBody"></div>
    <div class="container" id="slider"></div>

    <script>
        const story = [
            { t: "ميلاد ملكتي مارية", p: "نورتِ الدنيا بضحكتج، كل عام وأنتي قطعة من روحي.", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", btn: "نبدأ؟ ✨", icons: ['🌸','✨'] },
            { t: "يا قطعة من السكر", p: "كبرتِ سنة وصرتِ أحلى، ربي لا يحرمني منج.", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", btn: "بعد.. ❤️", icons: ['🍰','🎂'] },
            { t: "اعتذار حقيقي", p: "والله البعد صعب، وسامحيني لأن ما كدرت أكون يمج اليوم.", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9uH9T34u3U7YUnD/giphy.gif", btn: "سامحيني 🥺", icons: ['💔','🌧️'] },
            { t: "وعد حيدر", p: "أوعدج أول ما نلتقي أسويلج حفلة ما صايرة. أنتي ملكتي.", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L4lvBpHWkARu7Aac75/giphy.gif", btn: "أعشقج ❤️", icons: ['💍','💎'] },
            { t: "عيد ميلاد سعيد", p: "يلا اضحكي هسة، حيدر يحبج ويموت عليج. تم الصلح؟", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v86vXfG1KzE3MvW5sE/giphy.gif", btn: "أحبك حيدر 😍", icons: ['🎆','💖'] }
        ];

        let cur = 0;
        const slider = document.getElementById('slider');

        function build() {
            story.forEach((page, i) => {
                const div = document.createElement('div');
                div.className = `page ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <img src="${page.img}" class="main-sticker">
                    <h1>${page.t}</h1>
                    <p>${page.p}</p>
                    <button class="nav-btn" onclick="nextPage()">${page.btn}</button>
                `;
                slider.appendChild(div);
            });
        }

        function nextPage() {
            const pages = document.querySelectorAll('.page');
            if (cur < pages.length - 1) {
                pages[cur].classList.remove('active');
                cur++;
                pages[cur].classList.add('active');
            } else {
                alert("عيد ميلاد سعيد مارية! ❤️");
            }
        }

        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'bg-elements';
            el.innerHTML = story[cur].icons[Math.floor(Math.random() * 2)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }, 400);

        build();
    </script>
</body>
</html>

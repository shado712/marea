<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نجمة ديجيتال | مفاجأة مارية ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; overflow: hidden; 
            font-family: 'Cairo', sans-serif; transition: background 1.5s ease;
            background-color: #fdf2ff;
        }

        .container {
            height: 100vh; width: 100%; display: flex;
            align-items: center; justify-content: center; position: relative;
            z-index: 10;
        }

        .page {
            position: absolute; width: 90%; max-width: 450px;
            text-align: center; opacity: 0; visibility: hidden;
            transform: scale(0.5); transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .page.active { opacity: 1; visibility: visible; transform: scale(1); }

        /* ستايل الهدية الكبيرة */
        .gift-container {
            width: 250px; height: 250px; margin: 0 auto 30px;
            cursor: pointer; position: relative;
            font-size: 150px; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }

        /* حركات الاهتزاز عند الضغط */
        .shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0% { transform: rotate(0); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0); }
        }

        .opened-gift { transform: scale(1.5); opacity: 0; transition: 0.5s; }

        h1 { font-size: 28px; color: #b8860b; margin-bottom: 15px; }
        p { font-family: 'Amiri', serif; font-size: 22px; color: #555; line-height: 1.5; margin-bottom: 30px; }

        .btn-action {
            background: #ff4d6d; color: white; border: none;
            padding: 15px 40px; border-radius: 50px; font-size: 18px;
            font-weight: 900; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
        }

        /* تأثير الاحتفال */
        .confetti {
            position: absolute; top: -50px; pointer-events: none;
            animation: fall linear forwards; z-index: 100;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="bdayMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto"></audio>

    <div class="container" id="slider"></div>

    <script>
        const story = [
            { t: "اليوم نورت الدنيا! ✨", p: "كل عام وأنتِ بألف خير يا أغلى إنسانة.. حضرنا الج مفاجأة!", emoji: "👸", btn: "شنو هي؟ 😍", type: "normal" },
            { t: "هدية خاصة الج 🎁", p: "اضغطي على الهدية 3 مرات حتى تنفتح.. استعدي!", emoji: "🎁", btn: "اضغطي هنا 👇", type: "gift" },
            { t: "ميلاد سعيد مارية! 🎉", p: "ان شاء الله كل أيامك فرح وسعادة ونجاح.. أحبج!", emoji: "🎂", btn: "ابدأ من جديد 🔄", type: "normal" }
        ];

        let cur = 0;
        let clicks = 0;
        const slider = document.getElementById('slider');
        const audio = document.getElementById('bdayMusic');

        function build() {
            slider.innerHTML = '';
            story.forEach((page, i) => {
                const div = document.createElement('div');
                div.className = `page ${i === cur ? 'active' : ''}`;
                
                if(page.type === "gift") {
                    div.innerHTML = `
                        <h1>${page.t}</h1>
                        <div class="gift-container" id="bigGift" onclick="handleGiftClick()">🎁</div>
                        <p id="giftHint">اضغطي 3 مرات لتفتحي الهدية!</p>
                    `;
                } else {
                    div.innerHTML = `
                        <div style="font-size:100px; margin-bottom:20px;">${page.emoji}</div>
                        <h1>${page.t}</h1>
                        <p>${page.p}</p>
                        <button class="btn-action" onclick="nextPage()">${page.btn}</button>
                    `;
                }
                slider.appendChild(div);
            });
        }

        function handleGiftClick() {
            const gift = document.getElementById('bigGift');
            const hint = document.getElementById('giftHint');
            clicks++;

            // إضافة حركة اهتزاز
            gift.classList.add('shake');
            setTimeout(() => gift.classList.remove('shake'), 300);

            if(clicks === 1) hint.innerText = "باقي مرتين! 😍";
            if(clicks === 2) hint.innerText = "آخر مرة! استعدي... 🔥";
            
            if(clicks >= 3) {
                gift.innerHTML = "🎉"; // تتحول الهدية لانفجار
                gift.style.transform = "scale(2)";
                hint.innerText = "تفتحت المفاجأة! ✨";
                
                // تشغيل الموسيقى
                audio.play().catch(e => console.log("المتصفح منع التشغيل التلقائي"));
                
                // تأثير الاحتفال
                for(let i=0; i<50; i++) createConfetti();
                
                // الانتقال للصفحة الأخيرة بعد ثانيتين
                setTimeout(nextPage, 3000);
            }
        }

        function nextPage() {
            if(cur === story.length - 1) {
                location.reload();
                return;
            }
            cur++;
            build();
        }

        function createConfetti() {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.innerHTML = ['✨', '🎈', '🎉', '🎊', '🌸'][Math.floor(Math.random() * 5)];
            c.style.left = Math.random() * 100 + 'vw';
            c.style.fontSize = Math.random() * 20 + 20 + 'px';
            c.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }

        build();
    </script>
</body>
</html>

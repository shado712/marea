<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مارية.. عيد ميلاد سعيد 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; overflow: hidden; 
            font-family: 'Cairo', sans-serif; transition: background 1s ease;
            background-color: #fff5f7; /* لون ابتدائي فاتح */
        }

        .container {
            height: 100vh; width: 100%; display: flex;
            align-items: center; justify-content: center; position: relative;
            z-index: 10;
        }

        .page {
            position: absolute; width: 90%; max-width: 500px;
            text-align: center; opacity: 0; visibility: hidden;
            transform: scale(0.8); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .page.active { opacity: 1; visibility: visible; transform: scale(1); }

        /* الصورة المتحركة الرئيسية */
        .gif-display {
            width: 280px; height: 280px; margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        h1 { font-size: 38px; color: #d63384; margin-bottom: 10px; }
        p { font-family: 'Amiri', serif; font-size: 24px; color: #555; line-height: 1.5; margin-bottom: 30px; }

        /* أزرار بأشكال كيك وشموع */
        .special-btn {
            font-size: 50px; cursor: pointer; transition: 0.3s;
            background: none; border: none; display: inline-block;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            position: relative;
        }
        .special-btn:hover { transform: scale(1.2) rotate(5deg); }
        .btn-label { 
            display: block; font-size: 16px; font-weight: bold; 
            color: #d63384; font-family: 'Cairo'; margin-top: 5px;
        }

        /* استيكرات المطر المتساقطة */
        .rain-sticker {
            position: absolute; top: -50px;
            pointer-events: none; z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body id="bgBody">

    <div class="container" id="slider"></div>

    <script>
        const story = [
            { t: "ميلاد ملكتي مارية 👑", p: "اليوم نورت الدنيا بضحكتج الساحرة. كل عام وأنتي بخير.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/K97Zue697oY/giphy.gif", bg: "#fff0f3", btn: "🎂", label: "افتحي الكيكة", rain: "🎈" },
            { t: "أجمل من كبر سنة 😍", p: "صرتي أحلى بمليون مرة، وربي لا يحرمني منج ومن طيبة قلبج.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/66XU9U9U2JmXm/giphy.gif", bg: "#f0f7ff", btn: "🕯️", label: "ضوي الشمعة", rain: "🍰" },
            { t: "اعتذار مرّ القسوة 😔", p: "مارية.. قلبي يوجعني لأن بعيد عنج، وما كدرت أجيب لج هدية تليق بيج.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/OPU6wUKARA3iU/giphy.gif", bg: "#f8f9fa", btn: "🥺", label: "سامحيني", rain: "🌧️" },
            { t: "أنتي أغلى هدية 🎁", p: "لو بيدي أجيب لج الدنيا كلها وأخليها بين إيدج ما أقصر يا روحي.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l41lS0p30k5JzNpH2/giphy.gif", bg: "#fff9e6", btn: "🎁", label: "افتحي الهدية", rain: "💎" },
            { t: "وعد حيدر للأبد 💍", p: "أوعدج أول ما نلتقي أعوضج عن كل ثانية كنت بيها بعيد. أنتي ملكتي.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/26BRv0ThflsHCqfJA/giphy.gif", bg: "#f3e5f5", btn: "💍", label: "وعد للابد", rain: "💖" },
            { t: "يا قطعة من الجنة 🌸", p: "ضحكتج هي اللي تصبرني على هالأيام الصعبة. لا تحرميني منها.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/ICOgUN7SjnSUo/giphy.gif", bg: "#e8f5e9", btn: "🌻", label: "يا وردة", rain: "🌹" },
            { t: "طفلتي المدللة 🧸", p: "تبقين بنظري ذيج الطفلة اللي أخاف عليها من الهوا. تدللي ماريتي.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/ZBQhoZC0nqknSviupL/giphy.gif", bg: "#fff3e0", btn: "🧸", label: "دلولة حيدر", rain: "🍭" },
            { t: "المسافة مجرد أرقام 🌏", p: "قلوبنا متصلة بحبل ما ينقطع أبد. أنتي بكل دقة من قلبي.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKuylOmX8ReLth6/giphy.gif", bg: "#e0f2f1", btn: "🔐", label: "قفلت قلبي", rain: "✨" },
            { t: "عمر جديد وحب جديد ❤️", p: "يا رب تكون هالسنة بداية لكل خير تتمنيه. حيدر وياج لآخر نفس.", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l2R08bkvPrNMAnYv6/giphy.gif", bg: "#fff0f6", btn: "🥰", label: "أعشقج", rain: "💞" },
            { t: "تم الصلح يا روحي! ✅", p: "يلا اضحكي هسة ونوري دنيتي. ميلاد سعيد يا أحلى مارية بالعالم!", gif: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4Z2x6Z2x6bmV4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKDkDbIDJieKbVm/giphy.gif", bg: "#ffffff", btn: "🥂", label: "احتفلي!", rain: "🎆" }
        ];

        let cur = 0;
        const slider = document.getElementById('slider');
        const bgBody = document.getElementById('bgBody');

        function build() {
            story.forEach((page, i) => {
                const div = document.createElement('div');
                div.className = `page ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <img src="${page.gif}" class="gif-display">
                    <h1>${page.t}</h1>
                    <p>${page.p}</p>
                    <button class="special-btn" onclick="nextPage()">
                        ${page.btn}
                        <span class="btn-label">${page.label}</span>
                    </button>
                `;
                slider.appendChild(div);
            });
            bgBody.style.backgroundColor = story[0].bg;
        }

        function nextPage() {
            const pages = document.querySelectorAll('.page');
            if (cur < pages.length - 1) {
                pages[cur].classList.remove('active');
                cur++;
                pages[cur].classList.add('active');
                bgBody.style.backgroundColor = story[cur].bg;
            } else {
                alert("كل عام وأنتي بخير يا مارية! ❤️");
            }
        }

        // مطر الاستيكرات المتساقطة
        setInterval(() => {
            const s = document.createElement('div');
            s.className = 'rain-sticker';
            s.innerHTML = story[cur].rain;
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = Math.random() * 20 + 30 + 'px';
            s.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 5000);
        }, 400);

        build();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلاد ملكتي مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root { --p-color: #ff4d6d; }
        body {
            margin: 0; font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: background 1s ease-in-out;
            background: #000; color: white;
        }

        .main-container {
            width: 100%; max-width: 480px; height: 100vh;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .slide {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform: scale(0.8); opacity: 0; padding: 20px; box-sizing: border-box;
        }

        .slide.active { transform: scale(1); opacity: 1; z-index: 2; }
        .slide.prev { transform: translateY(-100%); opacity: 0; }

        /* البطاقة الزجاجية */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 40px; padding: 25px; width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            text-align: center;
        }

        /* المربع الأبيض للصور المتحركة */
        .img-square {
            width: 260px; height: 260px;
            margin: 0 auto 25px; border-radius: 35px;
            background: white; border: 5px solid #ffdeeb;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
        }
        .img-square img { width: 90%; height: 90%; object-fit: contain; }

        h1 { font-size: 26px; color: #ff8fa3; margin: 10px 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        p { font-size: 18px; line-height: 1.7; color: #fff; margin-bottom: 30px; font-family: 'Amiri', serif; }

        /* الأزرار التفاعلية */
        .btn-action {
            background: linear-gradient(90deg, #ff4d6d, #ff8fa3);
            color: white; border: none; padding: 16px 50px;
            border-radius: 50px; font-size: 19px; font-weight: bold;
            cursor: pointer; box-shadow: 0 12px 24px rgba(255, 77, 109, 0.5);
            transition: 0.4s;
        }
        .btn-action:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* الاستيكرات المتطايرة */
        .floating-sticker { position: absolute; pointer-events: none; z-index: 1; animation: floatUp linear infinite; font-size: 30px; }
        @keyframes floatUp {
            from { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-container" id="slider"></div>

    <script>
        const storyData = [
            { 
                t: "ميلاد ملكة قلبي مارية 👑", 
                p: "اليوم مو بس يوم ميلادج، اليوم نورت الدنيا كلها بوجودج. كل عام وأنتي أجمل شي صار بحياتي.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v96vXfG1KzE3MvW5sE/giphy.gif", 
                b: "مستعدة للحفلة؟ ✨", 
                bg: "radial-gradient(circle, #200122, #000000)",
                icons: ['🎈', '✨', '🎂']
            },
            { 
                t: "يا ضوه عيوني 😍", 
                p: "كل سنة وأنتي سالمة يا روحي، ربي يجعلها سنة فرح وسعادة وتحققين بيها كل أحلامج يا مارية.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v86vXfG1KzE3MvW5sE/giphy.gif", 
                b: "أحبج هواي ❤️", 
                bg: "linear-gradient(135deg, #4b1248, #000000)",
                icons: ['🎁', '💖', '🎉']
            },
            { 
                t: "اعتذار من القلب 😔", 
                p: "مارية.. والله قلبي يوجعني لأن بعيد عنج بهاللحظة وما كدرت أكون أول واحد يقدملج هدية بإيده.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9uH9T34u3U7YUnD/giphy.gif", 
                b: "سامحيني يا روحي 🥺", 
                bg: "linear-gradient(135deg, #0f0c29, #302b63)",
                icons: ['🌧️', '🥺', '💔']
            },
            { 
                t: "وعد حيدر 💍", 
                p: "أوعدج أول ما نلتقي أسويلج حفلة ما صايرة، وأعوضج عن كل ثانية كنت بيها بعيد عنج. أنتي أغلى هدية من الله.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L4lvBpHWkARu7Aac75/giphy.gif", 
                b: "وعد للأبد 💍", 
                bg: "linear-gradient(135deg, #5c2b4c, #2d1b33)",
                icons: ['🎀', '⭐', '💍']
            },
            { 
                t: "ما يفرقنا البعد ❤️", 
                p: "المسافة مجرد أرقام، بس روحج ساكنة بقلبي وبكل دقة منه. كل عام وأنتي لي يا مارية.", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VduFvSgSPS2H4XpnhB/giphy.gif", 
                b: "أعشقج ماريتي 🥰", 
                bg: "linear-gradient(135deg, #8c3b5d, #000000)",
                icons: ['💓', '🌹', '🦋']
            },
            { 
                t: "النهاية السعيدة 🎂", 
                p: "يلا هسة اضحكي ونوري الدنيا بضحكتج، حيدر يحبج ويموت عليج. ميلاد سعيد يا نبض قلبي!", 
                g: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3NueWZvbm41emx0bzR6cjI4dmx2Znd1Ym9icDhmN3ltemc2cW5iZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Y866z3V6Yf6WqXU8zL/giphy.gif", 
                b: "تم الصلح والاحتفال ✅", 
                bg: "linear-gradient(135deg, #ff8fa3, #ffe5ec)",
                icons: ['🎆', '🍰', '🌸']
            }
        ];

        let current = 0;
        const slider = document.getElementById('slider');

        storyData.forEach((item, i) => {
            const slide = document.createElement('div');
            slide.className = `slide ${i === 0 ? 'active' : ''}`;
            slide.innerHTML = `
                <div class="glass-card">
                    <div class="img-square"><img src="${item.g}" alt="loading..."></div>
                    <h1>${item.t}</h1>
                    <p>${item.p}</p>
                    <button class="btn-action" onclick="nextSlide()">${item.b}</button>
                </div>
            `;
            slider.appendChild(slide);
        });

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (current < slides.length - 1) {
                slides[current].classList.remove('active');
                slides[current].classList.add('prev');
                current++;
                slides[current].classList.add('active');
                
                // تغيير الخلفية
                document.body.style.background = storyData[current].bg;
                if (current >= 5) document.body.style.color = "#333";
            } else {
                alert("أحبج مارية! كل عام وأنتي بخير ❤️");
            }
        }

        // إنشاء استيكرات متغيرة مع الوقت
        setInterval(() => {
            const icons = storyData[current].icons;
            const s = document.createElement('div');
            s.className = 'floating-sticker';
            s.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            s.style.left = Math.random() * 90 + 5 + 'vw';
            s.style.animationDuration = Math.random() * 3 + 4 + 's';
            s.style.fontSize = Math.random() * 20 + 20 + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 7000);
        }, 300);

        // تعيين الخلفية الأولى
        document.body.style.background = storyData[0].bg;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصة ميلاد مارية 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; overflow: hidden; 
            font-family: 'Cairo', sans-serif; transition: background 1.2s ease;
            background-color: #fff5f7;
        }

        .container {
            height: 100vh; width: 100%; display: flex;
            align-items: center; justify-content: center; position: relative;
            z-index: 10;
        }

        .page {
            position: absolute; width: 90%; max-width: 450px;
            text-align: center; opacity: 0; visibility: hidden;
            transform: translateY(40px); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        .page.active { opacity: 1; visibility: visible; transform: translateY(0); }

        /* الكارت التوضيحي - مطابق تماماً للنمط المطلوب */
        .illustration-card {
            width: 260px; height: 260px; margin: 0 auto 30px;
            background: #ffffff; border-radius: 40px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(214, 51, 132, 0.1);
            border: 5px solid #fff;
            position: relative; overflow: hidden;
        }
        /* الصور التوضيحية المرسومة */
        .illustration-card img {
            width: 85%; height: 85%; object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(214, 51, 132, 0.2));
        }
        /* توهج خلف الكارت */
        .illustration-card::after {
            content: ''; position: absolute; width: 110%; height: 110%;
            background: radial-gradient(circle, rgba(255,143,163,0.3) 0%, transparent 70%);
            z-index: -1;
        }

        h1 { font-size: 32px; color: #d63384; margin-bottom: 10px; }
        p { font-family: 'Amiri', serif; font-size: 24px; color: #444; line-height: 1.6; margin-bottom: 35px; font-weight: bold; }

        /* الأزرار الاحتفالية */
        .event-btn {
            background: #ff4d6d; color: white; border: none;
            padding: 15px 50px; border-radius: 50px; font-size: 20px;
            font-weight: 900; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }
        .event-btn:hover { transform: scale(1.1); background: #d63384; }

        /* مطر الاستيكرات */
        .sticker-rain {
            position: absolute; top: -60px;
            pointer-events: none; z-index: 1;
            animation: rainEffect linear forwards;
        }
        @keyframes rainEffect { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body id="bgLayer">

    <div class="container" id="mainSlider"></div>

    <script>
        const story = [
            { t: "ميلاد الملكة مارية 👑", p: "اليوم مو بس يوم ميلادج، اليوم نورت الدنيا كلها بوجودج.", img: "https://i.ibb.co/L8G3w5g/cake-crown.png", bg: "#fff0f3", btn: "مستعدة للرحلة؟ ✨", rain: "🎈" },
            { t: "أجمل الذكريات 📸", p: "كل سنة وأنتي بقلبي تكبرين، يا أحلى ذكرى بحياتي.", img: "https://i.ibb.co/mDk3hCg/camera-heart.png", bg: "#f0f7ff", btn: "تكملة القصة..", rain: "💖" },
            { t: "اعتذار من القلب 😔", p: "مارية.. اعتذر لأن البعد منعني أكون يمج بهاللحظة.", img: "https://i.ibb.co/f4bN7QY/broken-heart.png", bg: "#f8f9fa", btn: "سامحيني 🥺", rain: "🌧️" },
            { t: "وعد باللقاء القريب ✈️", p: "أوعدج أول ما نلتقي، أعوضج عن كل لحظة غياب.", img: "https://i.ibb.co/3W4T5gW/map-heart.png", bg: "#fff9e6", btn: "وعد رجال 💍", rain: "✈️" },
            { t: "أنتي هدية حياتي 🎁", p: "لو بيدي أهديج عمري، والله ما يغلى عليج.", img: "https://i.ibb.co/jH6b0bQ/gift-crown.png", bg: "#f3e5f5", btn: "يا روحي ❤️", rain: "💎" },
            { t: "يا عطر الورد 🌹", p: "أنتي الوردة اللي تزيّن عالمي وتنوره بكل لحظة.", img: "https://i.ibb.co/mR3P88Y/rose-bouquet.png", bg: "#e8f5e9", btn: "يا أميرة ✨", rain: "🌻" },
            { t: "طفلتي المدللة 🧸", p: "تبقين بعيني ذيج الطفلة اللي أخاف عليها من نسمة الهواء.", img: "https://i.ibb.co/X8Y5G2q/teddy-bear.png", bg: "#fff3e0", btn: "أعشقج 😍", rain: "🍭" },
            { t: "أنتي سندي وقوتي 💪", p: "راح أبقى وياج ولأجليج، جبلاً ما يميل، لحد آخر نفس.", img: "https://i.ibb.co/yS5k1B9/shield-heart.png", bg: "#f1f8e9", btn: "أنتي قوتي", rain: "💞" },
            { t: "ضحكتج هي العيد 🎉", p: "لا تحرميني من هالضحكة، هي اللي تخليني عايش.", img: "https://i.giphy.com/media/VduFvSgSPS2H4XpnhB/giphy.gif", bg: "#fffde7", btn: "اضحكيلي 😍", rain: "🌸" },
            { t: "تم الصلح يا ملكة ✅", p: "كل عام وأنتي بألف خير. حيدر يحبج ويموت عليج!", img: "https://i.ibb.co/L8G3w5g/cake-crown.png", bg: "#ffffff", btn: "أحبك حيدر ❤️", rain: "🎇" }
        ];

        let cur = 0;
        const mainSlider = document.getElementById('mainSlider');

        function build() {
            story.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `page ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="illustration-card"><img src="${p.img}" alt="Illustration"></div>
                    <h1>${p.t}</h1>
                    <p>${p.p}</p>
                    <button class="event-btn" onclick="nextPage()">${p.btn}</button>
                `;
                mainSlider.appendChild(div);
            });
            document.body.style.backgroundColor = story[0].bg;
        }

        function nextPage() {
            const pages = document.querySelectorAll('.page');
            if (cur < pages.length - 1) {
                pages[cur].classList.remove('active');
                cur++;
                pages[cur].classList.add('active');
                document.body.style.backgroundColor = story[cur].bg;
            } else {
                alert("أحبج مارية.. ميلاد سعيد ❤️");
            }
        }

        setInterval(() => {
            const r = document.createElement('div');
            r.className = 'sticker-rain';
            r.innerHTML = story[cur].rain;
            r.style.left = Math.random() * 100 + 'vw';
            r.style.fontSize = Math.random() * 20 + 30 + 'px';
            r.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 5000);
        }, 400);

        build();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى مارية الملكة 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff4d6d; --s: #ff8fa3; --w: #ffffff; }
        body {
            margin: 0; font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: #0b0b0b; transition: 1s ease;
        }

        .main-wrapper {
            width: 100%; max-width: 450px; height: 100vh;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .slide {
            position: absolute; width: 90%; height: auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px); border-radius: 45px;
            padding: 40px 20px; box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex; flex-direction: column; align-items: center;
            transition: 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform: scale(0); opacity: 0;
        }

        .slide.active { transform: scale(1); opacity: 1; z-index: 10; }
        .slide.prev { transform: scale(1.5); opacity: 0; }

        /* المربع الملون للصور/الرموز */
        .illustration-box {
            width: 220px; height: 220px;
            background: var(--w); border-radius: 40px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px; box-shadow: 0 20px 40px rgba(255, 77, 109, 0.3);
            border: 6px solid var(--s); position: relative;
        }
        .illustration-box span { font-size: 130px; }

        /* تنسيق الكتابة الملكي */
        .text-content h1 {
            font-family: 'Reem Kufi', sans-serif; font-size: 32px;
            color: var(--s); margin: 0 0 15px; text-align: center;
        }
        .text-content p {
            font-size: 20px; line-height: 1.8; color: #fdfdfd;
            text-align: center; margin: 0 0 35px; font-weight: 600;
        }

        /* الأزرار التفاعلية المخصصة */
        .btn-custom {
            background: linear-gradient(45deg, var(--p), var(--s));
            color: white; border: none; padding: 18px 60px;
            border-radius: 60px; font-size: 20px; font-weight: 900;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255, 77, 109, 0.4);
            transition: 0.3s ease;
        }
        .btn-custom:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(255, 77, 109, 0.6); }

        /* زخارف الخلفية المتطايرة */
        .decor { position: absolute; pointer-events: none; z-index: 1; animation: float 6s infinite linear; }
        @keyframes float { 0% { transform: translateY(110vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-wrapper" id="slider"></div>

    <script>
        const story = [
            { t: "ميلاد ملكتي مارية 👸", p: "اليوم عيد ميلاد أغلى إنسانة بالكون. ربي يجعل أيامك كلها سعادة يا نبض حيدر.", e: "🎂", b: "نبدأ المشوار؟ ✨", bg: "#1a1a2e", sc: "🎈" },
            { t: "يا قطعة من السكر 🍭", p: "كبرت حبيبتي سنة، وصارت أحلى بمليون مرة. أنتي الهدية اللي الله رزقني بيها.", e: "🎁", b: "كملي يا روحي ❤️", bg: "#2d1b33", sc: "✨" },
            { t: "اعتذار من القلب 🥺", p: "مارية.. أدري إني بعيد عنك وما كدرت أجيب لك هدية تليق بجمالك، بس قلبي وياك بكل دقة.", e: "🧸", b: "سامحيني ماريتي 💔", bg: "#0f0c29", sc: "🌧️" },
            { t: "أنتي دنيتي كلها 🌍", p: "والله لو كنت قريب، كان سويت لك أكبر حفلة بالعراق، بس البعد هدّ حيلي. تقبلي مني هالكلمات.", e: "💎", b: "أنتي أغلى شي ✨", bg: "#311b33", sc: "⭐" },
            { t: "وعد حيدر للأبد 💍", p: "أوعدك أول ما نلتقي، أعوضك عن كل ثانية كنت فيها بعيد. أنتي طفلتي المدللة دائمًا.", e: "👑", b: "أعشقك مارية ❤️", bg: "#4a1248", sc: "🎀" },
            { t: "تم الصلح يا روحي؟ ✅", p: "يلا هسة اضحكي، ضحكتك هي اللي تضوي طريقي. ميلاد سعيد يا أحلى مارية!", e: "🌸", b: "أحبك حيدر 😍", bg: "#ffe5ec", sc: "💖" }
        ];

        let idx = 0;
        const slider = document.getElementById('slider');

        function render() {
            const item = story[idx];
            slider.innerHTML = `
                <div class="slide active">
                    <div class="illustration-box"><span>${item.e}</span></div>
                    <div class="text-content">
                        <h1>${item.t}</h1>
                        <p>${item.p}</p>
                    </div>
                    <button class="btn-custom" onclick="move()">${item.b}</button>
                </div>
            `;
            document.body.style.backgroundColor = item.bg;
            if (idx === 5) document.body.style.color = "#333";
        }

        function move() {
            if (idx < story.length - 1) {
                idx++; render();
            } else {
                alert("عيد ميلاد سعيد يا مارية! حيدر يحبك للأبد ❤️");
            }
        }

        setInterval(() => {
            const d = document.createElement('div');
            d.className = 'decor'; d.innerHTML = story[idx].sc;
            d.style.left = Math.random() * 90 + 'vw';
            d.style.fontSize = Math.random() * 20 + 20 + 'px';
            d.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 5000);
        }, 400);

        render();
    </script>
</body>
</html>
